    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
